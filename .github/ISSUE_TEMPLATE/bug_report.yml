name: Bug report
description: Report a reproducible Unity Architect Pro problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Plugin version, placeholder: 2.0.0-alpha.3}
    validations: {required: true}
  - type: input
    id: unity
    attributes: {label: Unity version}
  - type: textarea
    id: repro
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant sanitized logs}
